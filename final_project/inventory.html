<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/home.css">
    <style>
        .inventory-content {
            padding: 28px 34px;
        }

        @media (max-width: 900px) {
            .inventory-content {
                padding: 20px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <a class="brand" href="#" aria-label="Inventory home">
                <span class="brand-mark">I</span>
                <span class="brand-name">Inventory</span>
            </a>

            <nav class="side-nav" aria-label="Main navigation">
                <a class="nav-link" href="dashboard.html">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
                    <span>Home</span>
                </a>
                <a class="nav-link active" href="#inventory" aria-current="page">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></svg>
                    <span>Inventory</span><span class="nav-caret">›</span>
                </a>
                <a class="nav-link" href="dashboard.html#sales">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10m5 10V4m5 16v-7m5 7V7"/></svg>
                    <span>Reports</span>
                </a>
            </nav>
        </aside>

        <main class="main-content" id="inventory">
            <header class="topbar">
                <button class="mobile-menu" type="button" aria-label="Open menu">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <div class="topbar-tools">
                    <button class="round-tool notification-dot" type="button" aria-label="Notifications">●</button>
                    <button class="round-tool" type="button" aria-label="Recent activity">◷</button>
                    <label class="search-box">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
                        <input type="search" placeholder="Search" aria-label="Search">
                    </label>
                </div>
                <div class="profile-tools">
                    <span id="profile_name"></span>
                    <button class="round-tool" type="button" aria-label="Profile">👤</button>
                    <button class="round-tool" type="button" aria-label="Settings">⚙️</button>
                </div>
            </header>

            <div class="inventory-content container-fluid">
                <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-4">
                    <div>
                        <h1 class="h3 fw-bold mb-1">Inventory</h1>
                        <p class="text-secondary mb-0">Product records and stock details.</p>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-outline-success" data-bs-toggle="modal" data-bs-target="#modalAddProduct">Add Product</button>
                    </div>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="table-responsive">
                        <table class="table table-text table-hover align-middle mb-0">
                            <thead class="table-light fs-6">
                                <tr>
                                    <th scope="col" class="text-nowrap px-1 py-3">Product ID</th>
                                    <th scope="col" class="text-nowrap px-3 py-3">SKU</th>
                                    <th scope="col" class="text-nowrap px-3 py-3">Product Name</th>
                                    <th scope="col" class="text-nowrap px-3 py-3">Description</th>
                                    <th scope="col" class="text-nowrap px-3 py-3">Unit Price</th>
                                    <th scope="col" class="text-nowrap px-3 py-3">Quantity</th>
                                    <th scope="col" class="text-nowrap px-3 py-3">Minimum Stock</th>
                                    <th scope="col" class="text-nowrap px-3 py-3">Image Path</th>
                                    <th scope="col" class="text-nowrap px-3 py-3">Category ID</th>
                                    <th scope="col" class="text-nowrap px-3 py-3">Category Name</th>
                                    <th scope="col" class="text-nowrap px-3 py-3">Time Updated</th>
                                    <th scope="col"  class="text-end px-3 py-3">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="fs-6" id="inventoryTableBody">
                                <tr>
                                    <td colspan="12" class="text-center text-secondary py-5">
                                        Loading Products...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>


                <div class="modal fade" id="modalAddProduct" tabindex="-1" aria-labelledby="modalAddProductLabel" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered modal-lg">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h2 class="modal-title fs-5 fw-bold" id="modalAddProductLabel">Add Product</h2>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <form id="formAddProduct">
                                <div class="modal-body">
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label for="productSku" class="form-label">SKU</label>
                                            <input type="text" class="form-control" id="productSku" name="sku">
                                        </div>
                                        <div class="col-md-6">
                                            <label for="productName" class="form-label">Product Name</label>
                                            <input type="text" class="form-control" id="productName" name="name" required>
                                        </div>
                                        <div class="col-12">
                                            <label for="productDescription" class="form-label">Description</label>
                                            <textarea class="form-control" id="productDescription" name="description" rows="2"></textarea>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="unitPrice" class="form-label">Unit Price</label>
                                            <input type="number" class="form-control" id="unitPrice" name="unit_price" min="0" step="0.01" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="productQuantity" class="form-label">Quantity</label>
                                            <input type="number" class="form-control" id="productQuantity" name="quantity" min="0" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="minimumStock" class="form-label">Minimum Stock</label>
                                            <input type="number" class="form-control" id="minimumStock" name="min_stock_threshold" min="0" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="productCategoryId" class="form-label">Category ID</label>
                                            <input type="number" class="form-control" id="productCategoryId" name="category_id" min="1">
                                        </div>
                                        <div class="col-12">
                                            <label for="productImagePath" class="form-label">Image Path</label>
                                            <input type="text" class="form-control" id="productImagePath" name="image_path">
                                        </div>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                    <button type="submit" class="btn btn-success">Save Product</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="js/inventory.js"></script>
</body>
</html>
