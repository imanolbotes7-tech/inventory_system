<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Inventory Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/eggy.css">
</head>
<style>
    .glass-container {
        background: #e94d58;
        align-content: center;
        border-radius: 15px;
        backdrop-filter: blur(10px);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        padding-top: 100px;
    }

    .spinner-border {
        width: 3rem;
        height: 3rem;
    }
    .background {
        background-color: #f0f4f9;
        border-radius: 15px;
        backdrop-filter: blur(10px);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }

    .spinner-border {
        width: 3rem;
        height: 3rem;
    }
    .background {
        background-color: #f0f4f9;
   
    }
    </style>

<body class="bg-dark bg-gradient min-vh-100 d-flex align-items-center justify-content-center p-3">
<div id="loading" class="loading-screen background bg-gradient min-vh-100 d-flex align-items-center justify-content-center p-3" hidden>
    <div class="container ">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                <div class="glass-container mt-5  p-4 p-sm-5 text-center">
                    <h2 class="fw-bold mb-3 fs-3">Signing in...</h2>
                    <p class="text-white-50 mb-4">Please sign in to your account</p>
                    <p class="circle-avatar"></p>
                    <div class="spinner-border text-white" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>

</div>
    <div id="loginScreen" class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                <div class="glass-container p-4 p-sm-5 text-center">
                    <h2 class="fw-bold mb-3 fs-3">Welcome to the Inventory Management System</h2>
                    <p class="text-white-50 mb-4">Please sign in to your account</p>
                    <form action="#" id="login" class="text-start">
                        <div class="mb-3">
                            <label for="users" class="form-label text-white">Email</label>
                            <input name="users" id="users" class="form-control glass-input">
                        </div>
                        <div class="mb-4">
                            <label for="password_hash" class="form-label text-white">Password</label>
                            <input type="password" name="password_hash" id="password_hash" class="form-control glass-input"
                                required placeholder="••••••••">
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-custom btn-lg">Sign In</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js" type="text/javascript"></script>
</body>

</html>
